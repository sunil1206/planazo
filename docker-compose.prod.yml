version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  PRODUCTION — planazo.in (142.93.212.29)
#  No ports exposed except 80 (nginx).
#  Host nginx with SSL proxies into this nginx container.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB:       ${DB_NAME:-planazo}
      POSTGRES_USER:     ${DB_USER:-planazo}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-planazo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Main FastAPI app (replaces Django) ───────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    env_file: .env.production
    volumes:
      - media_files:/workspace/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Celery worker ─────────────────────────────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: always
    command: celery -A app.workers.celery_app worker -l info --concurrency=2
    env_file: .env.production
    volumes:
      - media_files:/workspace/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Legacy FastAPI AI microservice (ai/photobooth/images) ─────────────────────
  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --workers 2
    env_file: .env.production
    volumes:
      - media_files:/app/media
    networks:
      - internal

  # ── Frontend — Vite + React SPA, built to static files + served by nginx ──────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL:          https://planazo.in
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: always
    depends_on:
      - api
    networks:
      - internal

  # ── Nginx (SSL termination + HTTP→HTTPS redirect) ─────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/planazo.conf:/etc/nginx/conf.d/default.conf:ro
      - media_files:/app/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - fastapi
      - frontend
    networks:
      - internal

  # ── Monitoring (Prometheus + Grafana) ──────────────────────────────────────────
  # SSH-tunnel-only by design: ports are bound to 127.0.0.1, so they're not
  # reachable from the internet even though the server's firewall is open on
  # 80/443 — only a process running ON the server (or someone SSH-forwarding
  # into it) can reach them. See docs/monitoring.md for the tunnel command.
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      - api
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.2.0
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    depends_on:
      - prometheus
    networks:
      - internal

volumes:
  postgres_data:
  media_files:
  prometheus_data:
  grafana_data:

networks:
  internal:
    driver: bridge
