name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  # tests/ (pytest + pytest-asyncio + an in-memory SQLite DB — see
  # tests/conftest.py) covers the Planning Suite end-to-end: repositories,
  # services, API/auth/ownership. Everything else in the app still only has
  # the import-sanity check below — see BACKEND_AUDIT.md for what's untested.
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install backend deps
        run: pip install -r app/requirements.txt
      - name: Import sanity check
        working-directory: .
        run: |
          PYTHONPATH=. python -c "import app.main; print('app.main imported OK')"
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          SECRET_KEY: ci-smoke-test-secret
          SENTRY_DSN: ""
          MEDIA_ROOT: /tmp/planazo-ci-media
      - name: Run test suite
        working-directory: .
        run: pytest tests/ -v
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          SECRET_KEY: ci-smoke-test-secret
          SENTRY_DSN: ""
          MEDIA_ROOT: /tmp/planazo-ci-media

  deploy:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            # NOTE: confirm this matches wherever the repo is actually cloned
            # on the server (per DEPLOYMENT_HANDBOOK.md §8.2 folder layout).
            cd ~/apps/planazo
            git pull origin main
            cp .env.production .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build
            # nginx/planazo.conf is bind-mounted (no build: directive on the
            # nginx service), so `up -d --build` above never recreates or
            # restarts that container just because the file on disk changed
            # via git pull -- nginx keeps serving whatever config it loaded
            # at its last start. Reload explicitly so config changes (new
            # location blocks, etc.) actually take effect on every deploy.
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload
            # alembic upgrade head alone creates the full schema on a fresh DB
            # (migration 0000 backfills everything create_all() used to be
            # relied on for) and applies any incremental migrations on top.
            # DEBUG=False in production, so app/main.py's lifespan hook never
            # runs create_all() — alembic is the only thing that creates or
            # alters tables here. alembic.ini lives at app/alembic.ini, not the
            # container's default cwd (/workspace) — pass -c explicitly.
            docker compose -f docker-compose.prod.yml exec -T api alembic -c app/alembic.ini upgrade head
            echo "Deployed successfully"
