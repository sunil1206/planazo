name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  # tests/ (pytest + pytest-asyncio + an in-memory SQLite DB — see
  # tests/conftest.py) covers the Planning Suite end-to-end: repositories,
  # services, API/auth/ownership. Everything else in the app still only has
  # the import-sanity check below — see BACKEND_AUDIT.md for what's untested.
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install backend deps
        run: pip install -r app/requirements.txt
      - name: Import sanity check
        working-directory: .
        run: |
          PYTHONPATH=. python -c "import app.main; print('app.main imported OK')"
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          SECRET_KEY: ci-smoke-test-secret
          SENTRY_DSN: ""
      - name: Run test suite
        working-directory: .
        run: pytest tests/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          SECRET_KEY: ci-smoke-test-secret
          SENTRY_DSN: ""

  deploy:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            # NOTE: confirm this matches wherever the repo is actually cloned
            # on the server (per DEPLOYMENT_HANDBOOK.md §8.2 folder layout).
            cd ~/apps/planazo
            git pull origin main
            cp .env.production .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build
            # Base tables are created by SQLAlchemy's create_all() in app/main.py's
            # lifespan hook on first boot; alembic upgrade head applies any
            # incremental migrations layered on top (see app/alembic/versions/).
            # alembic.ini lives at app/alembic.ini, not the container's default
            # cwd (/workspace) — pass -c explicitly rather than relying on cwd.
            docker compose -f docker-compose.prod.yml exec -T api alembic -c app/alembic.ini upgrade head
            echo "Deployed successfully"
