# Serves the Vite production build (dist/) as a single-page app.
# All unmatched paths fall back to index.html so React Router can handle
# client-side routes like /invite/:slug directly.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
