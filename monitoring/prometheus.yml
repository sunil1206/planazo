global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: planazo
    env: development

scrape_configs:
  # Main API (app/ — replaced the old Django backend/). /metrics exposed via
  # prometheus-fastapi-instrumentator, wired in app/main.py's create_app().
  # NOTE: this job used to point at 'django:8000', a service that no longer
  # exists in docker-compose.yml — Prometheus was silently failing to scrape
  # anything from the main app until this was fixed.
  - job_name: api
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics
    scrape_interval: 15s

  # Legacy AI microservice (fastapi/ — photobooth/image tasks)
  - job_name: fastapi-legacy
    static_configs:
      - targets: ['fastapi:8001']
    metrics_path: /metrics
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Postgres exporter (if added later)
  # - job_name: postgres
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
