upstream api {
    server api:8000;
}

upstream fastapi {
    server fastapi:8001;
}

upstream frontend {
    server frontend:5173;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    # ── Media files (uploaded images, served locally in dev) ─────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── FastAPI — AI / image processing microservice ──────────────────────────
    location /api/v1/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── FastAPI WebSocket ─────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://fastapi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── Main FastAPI backend (api/, all REST routers) ─────────────────────────
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── SQLAdmin panels (main / vendor / gift) ────────────────────────────────
    location ~ ^/(admin|vendor-admin|gift-admin)/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /metrics {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # ── SEO — dynamically generated by app/seo/router.py ──────────────────────
    location = /sitemap.xml {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    location = /robots.txt {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # ── Vite HMR WebSocket (hot-module-replacement) ───────────────────────────
    # Vite's dev-server client connects over a plain WS upgrade on the same
    # origin (no dedicated path prefix like Next's /_next/webpack-hmr), so the
    # generic "/" location below just needs the Upgrade headers set.

    # ── Frontend — Vite + React SPA — all other requests ──────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
