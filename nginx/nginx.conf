# See nginx/planazo.conf's header comment for why proxy_pass uses
# $api_upstream / $fastapi_upstream / $frontend_upstream variables plus a
# `resolver` directive instead of a static `upstream {}` block — it stops
# nginx from caching a container's IP forever and 502ing every time that
# container is rebuilt/restarted without also restarting nginx.

server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    resolver 127.0.0.11 valid=10s;

    # ── Media files (uploaded images, served locally in dev) ─────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── FastAPI — AI / image processing microservice ──────────────────────────
    location /api/v1/ {
        set $fastapi_upstream http://fastapi:8001;
        proxy_pass $fastapi_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── FastAPI WebSocket ─────────────────────────────────────────────────────
    location /ws/ {
        set $fastapi_upstream http://fastapi:8001;
        proxy_pass $fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── Main FastAPI backend (api/, all REST routers) ─────────────────────────
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── SQLAdmin panels (main / vendor / gift) ────────────────────────────────
    location ~ ^/(admin|vendor-admin|gift-admin)/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /metrics {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location /health {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # ── SEO — dynamically generated by app/seo/router.py ──────────────────────
    location = /sitemap.xml {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location = /robots.txt {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # ── Server-rendered vendor SEO landing pages (app/ssr/router.py) ──────────
    location /vendors/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── Server-rendered blog (app/ssr/router.py) ──────────────────────────────
    location = /blog {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location /blog/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── Vite HMR WebSocket (hot-module-replacement) ───────────────────────────
    # Vite's dev-server client connects over a plain WS upgrade on the same
    # origin (no dedicated path prefix like Next's /_next/webpack-hmr), so the
    # generic "/" location below just needs the Upgrade headers set.

    # ── Frontend — Vite + React SPA — all other requests ──────────────────────
    location / {
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
