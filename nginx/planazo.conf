# ─────────────────────────────────────────────────────────────────────────────
#  PRODUCTION — Docker Nginx with SSL
#  Domain : planazo.in (142.93.212.29)
#  Certs  : /etc/letsencrypt/live/planazo.in/ (mounted from host)
# ─────────────────────────────────────────────────────────────────────────────
#
# Why proxy_pass uses $api_upstream / $fastapi_upstream / $frontend_upstream
# variables instead of a static `upstream { server api:8000; }` block: nginx
# resolves a plain hostname in an upstream block (or a bare proxy_pass
# http://api;) exactly once, when the worker process starts, and caches that
# IP for the worker's entire lifetime. Every time the `api` container was
# rebuilt/restarted (a new deploy, `docker compose up -d --build api`, etc.)
# Docker assigned it a new internal IP, but nginx kept sending traffic to the
# old dead one until nginx itself was restarted — this caused the recurring
# 502s on /api/* (including /api/auth/google) this session. Using a variable
# in proxy_pass forces nginx to re-resolve the hostname through the `resolver`
# directive below (Docker's embedded DNS at 127.0.0.11) on every request
# instead of caching it indefinitely, so the api/fastapi/frontend containers
# can be rebuilt independently of nginx without ever needing an nginx restart.

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name planazo.in www.planazo.in;
    return 301 https://$host$request_uri;
}

# ── HTTPS main server ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name planazo.in www.planazo.in;
    client_max_body_size 50M;

    ssl_certificate     /etc/letsencrypt/live/planazo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planazo.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Docker's embedded DNS server — re-resolves api/fastapi/frontend on every
    # request (valid=10s caps how long a resolved IP is trusted before the
    # next lookup) instead of nginx caching a hostname's IP forever. See the
    # file header above for why this matters.
    resolver 127.0.0.11 valid=10s;

    # ── Media files (uploaded images) ────────────────────────────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── FastAPI — AI / image processing microservice ──────────────────────────
    location /api/v1/ {
        set $fastapi_upstream http://fastapi:8001;
        proxy_pass         $fastapi_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Main FastAPI backend (api/, all REST routers) ─────────────────────────
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass         $api_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # ── SQLAdmin panels (main / vendor / gift) ────────────────────────────────
    location /admin/ {
        set $api_upstream http://api:8000;
        proxy_pass       $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /vendor-admin/ {
        set $api_upstream http://api:8000;
        proxy_pass       $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /gift-admin/ {
        set $api_upstream http://api:8000;
        proxy_pass       $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Health checks — /health, /health/live, /health/ready (app/main.py) ────
    location /health {
        set $api_upstream http://api:8000;
        proxy_pass       $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── SEO — dynamically generated by app/seo/router.py, must hit the api
    # container rather than the frontend's static nginx (exact-match `=`
    # takes priority over the catch-all `location /` below regardless of
    # block order, but keeping them here for readability). ────────────────────
    location = /sitemap.xml {
        set $api_upstream http://api:8000;
        proxy_pass       $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /robots.txt {
        set $api_upstream http://api:8000;
        proxy_pass       $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Server-rendered vendor SEO landing pages (app/ssr/router.py) — real
    # crawlable HTML for /vendors/{category}[/{city}[/{slug}]], generated by
    # the api container, not the SPA. Prefix match so it doesn't touch a
    # bare /vendors (no such SPA route exists today, but this keeps room for
    # one without a collision — see SEO_ROADMAP.md). ─────────────────────────
    location /vendors/ {
        set $api_upstream http://api:8000;
        proxy_pass       $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # ── Server-rendered blog (app/ssr/router.py) ──────────────────────────────
    location = /blog {
        set $api_upstream http://api:8000;
        proxy_pass       $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /blog/ {
        set $api_upstream http://api:8000;
        proxy_pass       $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # ── Frontend — Vite + React SPA — all other pages ─────────────────────────
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass         $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
