# ─────────────────────────────────────────────────────────────────────────────
#  PRODUCTION — Docker Nginx with SSL
#  Domain : planazo.in (142.93.212.29)
#  Certs  : /etc/letsencrypt/live/planazo.in/ (mounted from host)
# ─────────────────────────────────────────────────────────────────────────────

upstream django   { server django:8000; }
upstream fastapi  { server fastapi:8001; }
upstream frontend { server frontend:3000; }

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name planazo.in www.planazo.in;
    return 301 https://$host$request_uri;
}

# ── HTTPS main server ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name planazo.in www.planazo.in;
    client_max_body_size 50M;

    ssl_certificate     /etc/letsencrypt/live/planazo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planazo.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Static files (Django collectstatic) ──────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Media files (uploaded images) ────────────────────────────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── FastAPI — AI / image processing ──────────────────────────────────────
    location /api/v1/ {
        proxy_pass         http://fastapi;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Django REST API ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://django;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # ── Django Admin Panels ───────────────────────────────────────────────────
    location /admin/ {
        proxy_pass       http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /vendor-admin/ {
        proxy_pass       http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /gift-admin/ {
        proxy_pass       http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /wedding-admin/ {
        proxy_pass       http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /accounts/ {
        proxy_pass       http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Next.js static assets ─────────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Next.js frontend — all pages ──────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
